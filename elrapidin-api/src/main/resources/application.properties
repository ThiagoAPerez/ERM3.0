spring.application.name=elrapidin-api

# ===============================
# SERVER
# ===============================
server.port=9090

# ===============================
# DATASOURCE (MySQL / phpMyAdmin)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3307/erm_dev?useSSL=false&serverTimezone=UTC
spring.datasource.username=SAAP
spring.datasource.password=12341997SAP
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect



# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
